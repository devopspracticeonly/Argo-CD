apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  namespace: default
  labels:
    app.kubernetes.io/name: myapp
    app.kubernetes.io/part-of: eks-practice
    app.kubernetes.io/managed-by: kubectl
  annotations:
    description: "Deployment for Kubernetes/EKS practice"


spec:
  replicas: 2
  revisionHistoryLimit: 5
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: myapp

  template:
    metadata:
      labels:
        app: myapp
        env: test
        app.kubernetes.io/name: myapp
        app.kubernetes.io/part-of: eks-practice
      annotations:
        prometheus.io/scrape: "false"

    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: myapp

      containers:
        - name: nginx
          image: 736865445725.dkr.ecr.ap-south-1.amazonaws.com/microservice-demo:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: "10m"
            memory: "12Mi"
              limits:
                cpu: "20m"
                memory: "30Mi"
          env:
            - name: APP_ENV
              value: "test"
            - name: PORT
              value: "80"

          # Probes for health checks
          startupProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 10

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3

          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx

      volumes:
        - name: nginx-cache
          emptyDir: {}