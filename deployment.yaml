apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  namespace: default

spec:
  replicas: 2

  selector:
    matchLabels:
      app: myapp

  template:
    metadata:
      labels:
        app: myapp

    spec:
      containers:
      - name: myapp
        image: 736865445725.dkr.ecr.ap-south-1.amazonaws.com/microservice-demo:39
        ports:
        - containerPort: 8080
