apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  namespace: default

spec:
  replicas: 2

  selector:
    matchLabels:
      app: myapp

  template:
    metadata:
      labels:
        app: myapp
        env: test

    spec:
      containers:
      - name: pod-name
        image: busybox #736865445725.dkr.ecr.ap-south-1.amazonaws.com/microservice-demo:37
        command:
          - sh
          - -c
          - "sleep 3600"
        ports:
        - containerPort: 8080
        resources:
          requests:
             cpu: "100"
             memory: "500Gi"
