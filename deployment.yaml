apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  namespace: demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: myapp

  template:
    metadata:
      labels:
        app: myapp

    spec:
      containers:
      - name: myapp
        image: 702147744538.dkr.ecr.us-east-1.amazonaws.com/microservice-demo:latest
        ports:
        - containerPort: 8080
