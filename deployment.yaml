apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  namespace: default

spec:
  replicas: 2

  selector:
    matchLabels:
      app: myapp

  template:
    metadata:
      labels:
        app: myapp
        env: test

    spec:
      containers:
      - name: pod-name
        image: nginx:latest
       
        ports:
        - containerPort: 80
        resources:
          requests:
             cpu: "10m"
             memory: "50Mi"
