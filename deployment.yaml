apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  namespace: default
  labels:
    app.kubernetes.io/name: myapp
    app.kubernetes.io/part-of: eks-practice
    app.kubernetes.io/managed-by: kubectl
  annotations:
    description: "Advanced example Deployment for Kubernetes/EKS practice"

spec:
  replicas: 2
  revisionHistoryLimit: 5
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: myapp

  template:
    metadata:
      labels:
        app: myapp
        env: test
        app.kubernetes.io/name: myapp
        app.kubernetes.io/part-of: eks-practice
      annotations:
        prometheus.io/scrape: "false"

    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: myapp

      containers:
        - name: nginx
          image: 736865445725.dkr.ecr.ap-south-1.amazonaws.com/microservice-demo:latest
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: APP_ENV
              value: "test"
            - name: PORT
              value: "8080"
          securityContext:
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
          startupProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5

      volumes:
        - name: nginx-cache
          emptyDir: {}
