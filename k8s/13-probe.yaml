apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: checkout-availability
  namespace: checkout-production
  labels:
    release: monitoring
spec:
  interval: 15s
  module: http_2xx
  prober:
    url: checkout-probe.checkout-production.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
      - http://frontend.checkout-production.svc.cluster.local/
      labels:
        namespace: checkout-production
