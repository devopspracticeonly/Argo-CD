apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: inventory-availability
  namespace: inventory-production
  labels:
    release: monitoring
spec:
  interval: 15s
  module: http_2xx
  prober:
    url: inventory-probe.inventory-production.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
      - http://frontend.inventory-production.svc.cluster.local/
      labels:
        namespace: inventory-production
