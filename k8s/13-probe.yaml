apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: order-availability
  namespace: order-production
  labels:
    release: monitoring
spec:
  interval: 15s
  module: http_2xx
  prober:
    url: order-probe.order-production.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
      - http://frontend.order-production.svc.cluster.local/
      labels:
        namespace: order-production
