apiVersion: v1
kind: ConfigMap
metadata:
  name: metrics-script
  namespace: 503-demo
data:
  exporter.py: "import time, threading\nfrom http.server import BaseHTTPRequestHandler,\
    \ ThreadingHTTPServer\nfrom collections import Counter\ncounts=Counter({(s,'GET'):0\
    \ for s in ('200','404','500','502','503','504')})\nbounds=[.05,.1,.25,.5,1,2,5,10,30]\n\
    buckets=[0]*len(bounds)\ncount=0\nsum_duration=0.0\nlock=threading.Lock()\nclass\
    \ Handler(BaseHTTPRequestHandler):\n    def do_GET(self):\n        if self.path\
    \ != '/metrics':\n            self.send_error(404); return\n        with lock:\n\
    \            lines=['# TYPE http_requests_total counter']\n            lines +=\
    \ [f'http_requests_total{{status=\"{s}\",method=\"{m}\"}} {v}' for (s,m),v in\
    \ counts.items()]\n            lines += ['# TYPE http_request_duration_seconds\
    \ histogram']\n            lines += [f'http_request_duration_seconds_bucket{{le=\"\
    {b}\"}} {v}' for b,v in zip(bounds,buckets)]\n            lines += [f'http_request_duration_seconds_bucket{{le=\"\
    +Inf\"}} {count}',f'http_request_duration_seconds_count {count}',f'http_request_duration_seconds_sum\
    \ {sum_duration}']\n        self.send_response(200); self.send_header('Content-Type','text/plain;\
    \ version=0.0.4'); self.end_headers(); self.wfile.write(('\\n'.join(lines)+'\\\
    n').encode())\nthreading.Thread(target=ThreadingHTTPServer(('0.0.0.0',9113),Handler).serve_forever,daemon=True).start()\n\
    while True:\n    try:\n        f=open('/logs/metrics.log'); break\n    except\
    \ FileNotFoundError: time.sleep(.2)\nwhile True:\n    line=f.readline()\n    if\
    \ not line: time.sleep(.2); continue\n    try: s,m,d=line.split(); d=float(d)\n\
    \    except ValueError: continue\n    with lock:\n        counts[s,m]+=1; count+=1;\
    \ sum_duration+=d\n        for i,b in enumerate(bounds):\n            if d<=b:\
    \ buckets[i]+=1\n"
