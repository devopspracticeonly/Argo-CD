apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-blackbox
  namespace: timeout-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sre-blackbox
  template:
    metadata:
      labels:
        app: sre-blackbox
    spec:
      containers:
      - name: blackbox
        image: prom/blackbox-exporter:v0.26.0
        args:
        - --config.file=/config/blackbox.yml
        ports:
        - name: http
          containerPort: 9115
        volumeMounts:
        - name: config
          mountPath: /config
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 256Mi
      volumes:
      - name: config
        configMap:
          name: sre-blackbox-config
