apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  namespace: crashloop-demo
spec:
  replicas: 2
  selector:
    matchLabels: {app: payment-api}
  template:
    metadata:
      labels: {app: payment-api}
    spec:
      containers:
      - name: payment-api
        image: python:3.12-alpine
        command: [python, -u, /config/app.py]
        ports:
        - {name: http, containerPort: 8000}
        readinessProbe:
          httpGet: {path: /, port: http}
          periodSeconds: 5
        resources:
          requests: {cpu: 50m, memory: 32Mi}
          limits: {cpu: 200m, memory: 128Mi}
        volumeMounts:
        - {name: config, mountPath: /config, readOnly: true}
      volumes:
      - name: config
        configMap: {name: payment-config}
