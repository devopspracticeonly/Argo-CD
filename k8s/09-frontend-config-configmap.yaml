apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: three-tier
data:
  index.html: '<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport"
    content="width=device-width,initial-scale=1"><title>Task board</title><style>body{font:16px
    system-ui;background:#eef2f7;color:#17253a;max-width:760px;margin:50px auto;padding:20px}main{background:white;padding:28px;border-radius:16px}li{display:flex;gap:12px;align-items:center;padding:12px;border-bottom:1px
    solid #ddd}li span{flex:1}input,button{padding:10px}button{cursor:pointer}#status{color:#345}</style><main><h1>Three-tier
    task board</h1><p>NGINX / PostgREST / PostgreSQL</p><form id="form"><input id="title"
    required maxlength="200" placeholder="New task"><button>Add task</button></form><p
    id="status" role="status"></p><ul id="items"></ul><button id="refresh">Refresh</button></main><script>

    const statusEl=document.querySelector(''#status''), items=document.querySelector(''#items'');

    async function api(path='''',options={}){let r=await fetch(''/api/tasks''+path,{...options,headers:{''Content-Type'':''application/json''}});if(!r.ok)throw
    Error(''HTTP ''+r.status);return r.status===204||r.status===201?null:r.json()}

    async function run(fn){try{await fn();await load()}catch(e){statusEl.textContent=''Request
    failed: ''+e.message}}

    async function load(){let rows=await api(''?order=id.asc'');items.replaceChildren();for(let
    row of rows){let li=document.createElement(''li''), c=document.createElement(''input''),
    s=document.createElement(''span''), b=document.createElement(''button'');c.type=''checkbox'';c.checked=row.done;c.onchange=()=>run(()=>api(''?id=eq.''+row.id,{method:''PATCH'',body:JSON.stringify({done:c.checked})}));s.textContent=row.title;b.textContent=''Delete'';b.onclick=()=>run(()=>api(''?id=eq.''+row.id,{method:''DELETE''}));li.append(c,s,b);items.append(li)}statusEl.textContent=rows.length+''
    tasks loaded from PostgreSQL''}

    document.querySelector(''#form'').onsubmit=e=>{e.preventDefault();let t=document.querySelector(''#title'');run(async()=>{await
    api('''',{method:''POST'',body:JSON.stringify({title:t.value})});t.value=''''})};document.querySelector(''#refresh'').onclick=()=>run(async()=>{});run(async()=>{});

    </script></html>'
  default.conf: "server {\n  listen 80;\n  root /usr/share/nginx/html;\n  location\
    \ / { try_files $uri $uri/ /index.html; }\n  location = /healthz { return 200\
    \ \"ok\"; }\n  location /api/ {\n    proxy_pass http://backend:3000/;\n    proxy_connect_timeout\
    \ 3s;\n    proxy_read_timeout 10s;\n  }\n}\n"
