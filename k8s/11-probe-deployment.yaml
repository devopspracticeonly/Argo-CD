apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-probe
  namespace: checkout-production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout-probe
  template:
    metadata:
      labels:
        app: checkout-probe
    spec:
      containers:
      - name: blackbox
        image: prom/blackbox-exporter:v0.26.0
        args:
        - --config.file=/config/blackbox.yml
        ports:
        - containerPort: 9115
        volumeMounts:
        - name: config
          mountPath: /config
      volumes:
      - name: config
        configMap:
          name: checkout-probe
