apiVersion: v1
kind: ConfigMap
metadata:
  name: checkout-api-code
  namespace: checkout-production
data:
  app.py: "from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer\nimport\
    \ json, time, os\nclass Handler(BaseHTTPRequestHandler):\n    def do_GET(self):\n\
    \        if self.path != \"/healthz\":\n            time.sleep(float(os.environ.get(\"\
    PROCESSING_INTERVAL\", \"0.02\")))\n        body=json.dumps({'checkouts':[{'id':101,'status':'confirmed'}]}).encode()\n\
    \        self.send_response(200)\n        self.send_header('Content-Type','application/json')\n\
    \        self.send_header('Content-Length',str(len(body)))\n        self.end_headers()\n\
    \        self.wfile.write(body)\nThreadingHTTPServer(('0.0.0.0',8080),Handler).serve_forever()\n"
