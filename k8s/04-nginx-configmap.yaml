apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: timeout-demo
data:
  default.conf: "log_format metrics escape=json '{\"status\":$status,\"method\":\"\
    $request_method\",\"duration\":$request_time}';\nserver {\n    listen 80;\n  \
    \  access_log /dev/stdout combined;\n    access_log /logs/metrics.log metrics;\n\
    \    location / {\n        proxy_pass http://backend-service:80;\n        proxy_connect_timeout\
    \ 5s;\n        proxy_send_timeout 5s;\n        proxy_read_timeout 5s;\n    }\n\
    }\n"
