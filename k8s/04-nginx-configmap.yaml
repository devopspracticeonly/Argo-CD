apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: timeout-demo
data:
  default.conf: |
    log_format metrics escape=json
      '{"status":$status,"method":"$request_method","duration":$request_time}';

    server {
        listen 80;

        access_log /dev/stdout combined;
        access_log /logs/metrics.log metrics;

        location / {
            proxy_pass http://backend-service:80;
            proxy_connect_timeout 5s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;

            proxy_intercept_errors on;
            error_page 502 =503 /unavailable;
        }

        location = /unavailable {
            internal;
            return 503 "Service Temporarily Unavailable\n";
        }

        location = /maintenance {
            return 503 "Application Under Maintenance\n";
        }
    }
