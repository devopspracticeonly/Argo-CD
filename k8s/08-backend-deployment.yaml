apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: three-tier
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: postgrest
        image: postgrest/postgrest:v12.2.3
        ports:
        - containerPort: 3000
        env:
        - name: PGRST_DB_URI
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: PGRST_DB_URI
        - name: PGRST_DB_SCHEMAS
          value: api
        - name: PGRST_DB_ANON_ROLE
          value: web_anon
        - name: PGRST_SERVER_HOST
          value: 0.0.0.0
        readinessProbe:
          httpGet:
            path: /tasks?limit=1
            port: 3000
          periodSeconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
