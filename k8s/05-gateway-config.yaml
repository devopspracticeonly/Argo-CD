apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: crashloop-demo
data:
  default.conf: |
    log_format metrics '$status $request_time';
    server {
      listen 80;
      access_log /dev/stdout combined;
      access_log /logs/access.log metrics;
      location = /healthz { return 200 'gateway healthy'; }
      location / {
        proxy_pass http://payment-api:80;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_intercept_errors on;
        error_page 502 504 =503 /unavailable;
      }
      location = /unavailable { internal; return 503 'Payment API unavailable'; }
    }
  exporter.py: |
    import time, threading
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from collections import Counter
    counts = Counter({200:0, 503:0})
    bounds = [.005,.01,.025,.05,.1,.25,.5,1,2,3,5,10]
    buckets = [0]*len(bounds)
    total = 0
    duration = 0.0
    lock = threading.Lock()
    def tail():
        global total, duration
        while True:
            try:
                f = open('/logs/access.log')
                break
            except FileNotFoundError:
                time.sleep(.2)
        while True:
            line = f.readline()
            if not line:
                time.sleep(.2)
                continue
            try:
                status, elapsed = line.split()
                status, elapsed = int(status), float(elapsed)
            except ValueError:
                continue
            with lock:
                counts[status] += 1
                total += 1
                duration += elapsed
                for i,b in enumerate(bounds):
                    if elapsed <= b: buckets[i] += 1
    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path != '/metrics':
                self.send_error(404)
                return
            with lock:
                lines = ['# TYPE http_requests_total counter']
                lines += [f'http_requests_total{{status="{s}"}} {v}' for s,v in counts.items()]
                lines += ['# TYPE http_request_duration_seconds histogram']
                lines += [f'http_request_duration_seconds_bucket{{le="{b}"}} {v}' for b,v in zip(bounds,buckets)]
                lines += [f'http_request_duration_seconds_bucket{{le="+Inf"}} {total}', f'http_request_duration_seconds_count {total}', f'http_request_duration_seconds_sum {duration}']
                body = ('\n'.join(lines)+'\n').encode()
            self.send_response(200)
            self.send_header('Content-Type','text/plain; version=0.0.4')
            self.end_headers()
            self.wfile.write(body)
    threading.Thread(target=tail, daemon=True).start()
    ThreadingHTTPServer(('0.0.0.0',9113), Handler).serve_forever()
