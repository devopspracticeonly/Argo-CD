
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-gateway
  namespace: timeout-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-gateway
  template:
    metadata:
      labels:
        app: nginx-gateway
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
            - name: access-logs
              mountPath: /logs

        - name: metrics-exporter
          image: python:3.12-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              pip install --no-cache-dir prometheus-client==0.22.1 &&
              python -u /scripts/exporter.py
          ports:
            - containerPort: 9113
              name: metrics
          volumeMounts:
            - name: access-logs
              mountPath: /logs
            - name: metrics-script
              mountPath: /scripts

      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
        - name: metrics-script
          configMap:
            name: nginx-metrics-script
        - name: access-logs
          emptyDir: {}
