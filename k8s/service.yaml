apiVersion: v1
kind: Service
metadata:
  name: myapp-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: myapp # Must match your Deployment's pod labels
  ports:
    - port: 80
      targetPort: 8080 # Port your container listens on
      nodePort: 30000   # Must match containerPort in kind-config.yaml
