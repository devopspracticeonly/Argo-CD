apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-gateway
  namespace: timeout-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-gateway
  template:
    metadata:
      labels:
        app: nginx-gateway
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - name: http
          containerPort: 80
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d
        - name: access-logs
          mountPath: /logs
        resources: &id001
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 256Mi
      - name: metrics-exporter
        image: python:3.12-alpine
        command:
        - /bin/sh
        - -c
        args:
        - pip install --no-cache-dir prometheus-client==0.22.1 && exec python -u /scripts/exporter.py
        ports:
        - name: metrics
          containerPort: 9113
        readinessProbe:
          httpGet:
            path: /metrics
            port: 9113
          periodSeconds: 5
        volumeMounts:
        - name: access-logs
          mountPath: /logs
        - name: metrics-script
          mountPath: /scripts
        resources: *id001
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config
      - name: metrics-script
        configMap:
          name: nginx-metrics-script
      - name: access-logs
        emptyDir:
          sizeLimit: 100Mi
