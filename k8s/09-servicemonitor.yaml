apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: 503-monitor
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
    - 503-demo
  selector:
    matchLabels:
      app: nginx-metrics
  endpoints:
  - port: metrics
    interval: 15s
    path: /metrics
