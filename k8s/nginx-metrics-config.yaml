
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-metrics-script
  namespace: timeout-demo
data:
  exporter.py: |
    import time
    import json
    from prometheus_client import Counter, Histogram, start_http_server

    REQUESTS = Counter(
        "http_requests_total",
        "Total HTTP requests",
        ["status", "method"]
    )

    LATENCY = Histogram(
        "http_request_duration_seconds",
        "HTTP request duration",
        buckets=(0.05, 0.1, 0.25, 0.5, 1, 2, 5, 6, 10, 15, 20, 30)
    )

    for status in ["200", "400", "404", "429", "500", "502", "503", "504"]:
        REQUESTS.labels(status=status, method="GET")

    start_http_server(9113)

    while True:
        try:
            logfile = open("/logs/metrics.log", "r")
            break
        except FileNotFoundError:
            time.sleep(1)

    while True:
        line = logfile.readline()

        if not line:
            time.sleep(0.2)
            continue

        try:
            data = json.loads(line)

            REQUESTS.labels(
                status=str(data["status"]),
                method=data["method"]
            ).inc()

            LATENCY.observe(float(data["duration"]))

        except (ValueError, KeyError):
            continue
