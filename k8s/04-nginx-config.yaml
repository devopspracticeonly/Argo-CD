apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: 503-demo
data:
  default.conf: "log_format metrics '$status $request_method $request_time';\nserver\
    \ {\n    listen 80;\n    access_log /dev/stdout combined;\n    access_log /logs/metrics.log\
    \ metrics;\n    location = /healthz { access_log off; return 200 \"OK\\n\"; }\n\
    \    location = /maintenance { return 503 \"Application Under Maintenance\\n\"\
    ; }\n    location / {\n        proxy_pass http://backend-service:80;\n       \
    \ proxy_connect_timeout 2s;\n        proxy_read_timeout 5s;\n        proxy_intercept_errors\
    \ on;\n        error_page 502 504 =503 /unavailable;\n    }\n    location = /unavailable\
    \ { internal; return 503 \"Backend Unavailable\\n\"; }\n}\n"
