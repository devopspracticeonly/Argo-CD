apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: checkout-availability
  namespace: checkout-production
  labels:
    release: monitoring
spec:
  groups:
  - name: checkout.rules
    rules:
    - alert: CheckoutApplicationLatencyHigh
      expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace="checkout-production"}[2m])))
        > 0.5
      for: 2m
      labels:
        severity: warning
        namespace: checkout-production
        application: checkout-api
      annotations:
        summary: Checkout requests are slow
        description: P95 request latency is {{ $value }} seconds.
        dashboard: SRE | Production Incident Troubleshooting
