apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: inventory-availability
  namespace: inventory-production
  labels:
    release: monitoring
spec:
  groups:
  - name: inventory.rules
    rules:
    - alert: InventoryApplicationAvailabilityDegraded
      expr: 100 * sum(rate(http_requests_total{namespace="inventory-production",status=~"5.."}[2m]))
        / clamp_min(sum(rate(http_requests_total{namespace="inventory-production"}[2m])),
        0.000001) > 5
      for: 2m
      labels:
        severity: warning
        namespace: inventory-production
        application: inventory-api
      annotations:
        summary: Inventory requests failing
        description: HTTP 5xx rate is {{ $value }} percent.
        dashboard: SRE | Production Incident Troubleshooting
