apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-gateway
  namespace: 503-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-gateway
  template:
    metadata:
      labels:
        app: nginx-gateway
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /healthz
            port: 80
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/conf.d
        - name: logs
          mountPath: /logs
      - name: metrics-exporter
        image: python:3.12-alpine
        command:
        - python
        - -u
        - /scripts/exporter.py
        ports:
        - containerPort: 9113
        readinessProbe:
          httpGet:
            path: /metrics
            port: 9113
        volumeMounts:
        - name: logs
          mountPath: /logs
        - name: script
          mountPath: /scripts
      volumes:
      - name: config
        configMap:
          name: nginx-config
      - name: script
        configMap:
          name: metrics-script
      - name: logs
        emptyDir: {}
