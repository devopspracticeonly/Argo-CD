apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-api
  namespace: order-production-006
spec:
  replicas: 3
  selector:
    matchLabels:
      app: order-api
  template:
    metadata:
      labels:
        app: order-api
    spec:
      containers:
      - name: order-api
        image: python:3.12-alpine
        command:
        - python
        - /app/server.py
        ports:
        - name: http
          containerPort: 8080
        volumeMounts:
        - name: source
          mountPath: /app
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
      volumes:
      - name: source
        configMap:
          name: order-api
      nodeSelector:
        workload-pool: orders-dedicated
