apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  namespace: payment-production
spec:
  replicas: 3
  selector:
    matchLabels: &id001
      app: payment-api
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: api
        image: python:3.12-alpine
        command:
        - python
        - /app/server.py
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8081
          periodSeconds: 5
        volumeMounts:
        - name: source
          mountPath: /app
      volumes:
      - name: source
        configMap:
          name: payment-source
