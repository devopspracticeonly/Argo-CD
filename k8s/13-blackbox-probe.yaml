apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: application-availability
  namespace: monitoring
  labels:
    release: monitoring
spec:
  interval: 30s
  module: http_2xx
  prober:
    url: sre-blackbox.timeout-demo.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
      - http://gateway-service.timeout-demo.svc.cluster.local/
      - http://gateway-service.timeout-demo.svc.cluster.local/slow
