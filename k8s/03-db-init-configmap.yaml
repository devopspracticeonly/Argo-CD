apiVersion: v1
kind: ConfigMap
metadata:
  name: db-init
  namespace: three-tier
data:
  01-init.sql: 'CREATE ROLE web_anon NOLOGIN;

    CREATE ROLE authenticator LOGIN NOINHERIT PASSWORD ''labapi123'';

    GRANT web_anon TO authenticator;

    CREATE SCHEMA api;

    CREATE TABLE api.tasks (id bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY, title
    text NOT NULL CHECK (length(title) BETWEEN 1 AND 200), done boolean NOT NULL DEFAULT
    false);

    GRANT USAGE ON SCHEMA api TO web_anon;

    GRANT SELECT, INSERT, UPDATE, DELETE ON api.tasks TO web_anon;

    GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA api TO web_anon;

    INSERT INTO api.tasks(title) VALUES (''Verify Kubernetes deployment''), (''Practice
    database persistence'');

    '
