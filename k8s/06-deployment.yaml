apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-gateway
  namespace: inventory-production
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app: inventory-gateway
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: inventory-gateway
        image: python:3.12-alpine
        command:
        - python
        - -u
        - /app/app.py
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 300m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 5
        volumeMounts:
        - name: code
          mountPath: /app
          readOnly: true
      volumes:
      - name: code
        configMap:
          name: inventory-gateway-code
