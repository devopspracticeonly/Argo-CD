apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: order-production-006
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: python:3.12-alpine
        command:
        - python
        - /app/server.py
        ports:
        - name: http
          containerPort: 8080
        volumeMounts:
        - name: source
          mountPath: /app
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
      volumes:
      - name: source
        configMap:
          name: frontend
