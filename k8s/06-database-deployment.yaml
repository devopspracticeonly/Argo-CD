apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
  namespace: three-tier
spec:
  replicas: 1
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      labels:
        app: database
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: tasks
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: POSTGRES_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        readinessProbe:
          exec: &id001
            command:
            - sh
            - -c
            - pg_isready -h 127.0.0.1 -U postgres -d tasks
          periodSeconds: 5
        startupProbe:
          exec: *id001
          periodSeconds: 5
          failureThreshold: 60
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: init
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: database-data
      - name: init
        configMap:
          name: db-init
  strategy:
    type: Recreate
