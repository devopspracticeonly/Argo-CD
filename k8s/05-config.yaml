apiVersion: v1
kind: ConfigMap
metadata:
  name: checkout-gateway-code
  namespace: checkout-production
data:
  app.py: "from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer\nfrom\
    \ urllib.request import urlopen\nimport time, threading\nlock=threading.Lock()\n\
    counts={s:0 for s in (200,502,503,504)}\nbounds=[.005,.01,.025,.05,.1,.25,.5,1,2,3,4,5,10]\n\
    buckets=[0]*len(bounds)\ntotal=0; duration=0.0\nclass Handler(BaseHTTPRequestHandler):\n\
    \    def do_GET(self):\n        global total,duration\n        if self.path=='/metrics':\n\
    \            with lock:\n                lines=['# TYPE http_requests_total counter']+[f'http_requests_total{{status=\"\
    {s}\",method=\"GET\"}} {n}' for s,n in counts.items()]\n                lines+=['#\
    \ TYPE http_request_duration_seconds histogram']+[f'http_request_duration_seconds_bucket{{le=\"\
    {b}\"}} {n}' for b,n in zip(bounds,buckets)]\n                lines += [f'http_request_duration_seconds_bucket{{le=\"\
    +Inf\"}} {total}',f'http_request_duration_seconds_count {total}',f'http_request_duration_seconds_sum\
    \ {duration}']\n            status=200; body=('\\n'.join(lines)+'\\n').encode();\
    \ content='text/plain; version=0.0.4'\n        elif self.path=='/healthz':\n \
    \           status=200; body=b'ok'; content='text/plain'\n        else:\n    \
    \        start=time.monotonic()\n            try:\n                with urlopen('http://checkout-api:8080/',timeout=8)\
    \ as response:\n                    status=response.status; body=response.read()\n\
    \            except Exception as exc:\n                print(f'Upstream request\
    \ failed: {exc}',flush=True)\n                status=503; body=b'Checkout service\
    \ temporarily unavailable'\n            elapsed=time.monotonic()-start; content='application/json'\
    \ if status==200 else 'text/plain'\n            with lock:\n                counts[status]=counts.get(status,0)+1;\
    \ total+=1; duration+=elapsed\n                for i,b in enumerate(bounds):\n\
    \                    if elapsed<=b: buckets[i]+=1\n        self.send_response(status);\
    \ self.send_header('Content-Type',content); self.send_header('Content-Length',str(len(body)));\
    \ self.end_headers()\n        try: self.wfile.write(body)\n        except BrokenPipeError:\
    \ pass\nThreadingHTTPServer(('0.0.0.0',8080),Handler).serve_forever()\n"
