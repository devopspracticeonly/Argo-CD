apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crashloop-lab
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR-USERNAME/crashloop-lab.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: crashloop-demo
  syncPolicy:
    syncOptions: [CreateNamespace=true]
