apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: inc006
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
    - order-production-006
  selector:
    matchLabels:
      app: frontend
  endpoints:
  - port: http
    path: /metrics
    interval: 15s
