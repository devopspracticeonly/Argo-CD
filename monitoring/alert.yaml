apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: inc006
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
  - name: inc006
    rules:
    - alert: OrderApplicationAvailabilityLow
      expr: kube_deployment_status_replicas_available{namespace="order-production-006",deployment="order-api"}
        == 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: Order application unavailable
